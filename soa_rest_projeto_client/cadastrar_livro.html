<!DOCTYPE html>
<html lang="pt-br">
    <head>
        <title>Cadastrar Livro</title>
        <meta charset="UTF-8">
        <link rel="stylesheet" href="stylecadastrar.css">

        <script type="text/javascript">
            let endpoint = 'http://localhost:9000/livro'

            async function cadastrar() {
                resposta = await fetch(endpoint, {
                    method: 'POST',
                    headers: {
                        'content-type': 'application/json'
                    },
                    body: JSON.stringify({
                        'titulo': document.getElementById('titulo').value,
                        'autor': document.getElementById('autor').value,
                        'isbn': document.getElementById('isbn').value,
                        'ano': Number(document.getElementById('ano').value)
                    })
                }).then(res => res.json())

                alert(resposta['mensagem'])
            }

            window.onload = () => {
                document.getElementById('frmCadastro').onsubmit = (evento) => {
                    evento.preventDefault()
                    cadastrar()
                }
            }
        </script>
    </head>

    <body>
        <h1>Cadastrar Livro</h1>

        <form action="#" method="POST" id="frmCadastro">

            <label for="titulo">Título:</label>
            <input type="text" id="titulo" name="titulo" maxlength="100" required>

            <label for="autor">Autor:</label>
            <input type="text" id="autor" name="autor" maxlength="100" required>

            <label for="isbn">ISBN:</label>
            <input type="text" id="isbn" name="isbn" maxlength="20" required>

            <label for="ano">Ano:</label>
            <input type="number" id="ano" name="ano" required>

            <button>Cadastrar</button>

        </form>
    </body>
</html>
